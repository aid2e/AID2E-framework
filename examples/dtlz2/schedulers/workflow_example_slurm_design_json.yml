problem:
  name: "DTLZ2 Slurm Design-JSON Workflow Example"
  problem_type: "DTLZ2"
  output_location: "../../experimental_tests/output/slurm_v2_output"
  work_location: "../../experimental_tests/output/slurm_v2_work"
  design_parameters_file: "../optimizers/dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 2
    n_iterations: 1
    batch_size: 1
    seed: 7

scheduler:
  runner_type: "SlurmRunner"
  parameters:
    job_name_prefix: "aid2e_cfg"
    setup_commands:
      - "module load miniforge3/24.9.2-0"
      - "conda activate env_AID2E"
    poll_interval: 2

workflows:
  workflows:
    - name: "dtlz2_slurm_design_json_eval"
      description: "Config-driven Slurm workflow using a framework-generated design JSON file"
      branches:
        - name: "main"
          stages:
            - name: "evaluate"
              jobs:
                - name: "compute_dtlz2"
                  command: "python"
                  rule: >-
                    {command}
                    {repo_root}/examples/dtlz2/schedulers/slurm_dtlz2_from_design_json.py
                    --design {design_file}
                    --output {payload[output_file]}
                    --label {payload[label]}
                    --sleep-sec {payload[sleep_sec]}
                    --repeat {payload[repeat]}
                  payload:
                    output_file: "{output_dir}/objectives.json"
                    label: "config-driven-slurm"
                    sleep_sec: 0.3
                    repeat: 2
                  outputs:
                    - path: "{payload[output_file]}"
                      format: "json"
              parallelism:
                max_concurrent: 1
                retry_max: 1
                timeout_sec: 300
