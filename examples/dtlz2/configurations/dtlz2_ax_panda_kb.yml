# Ax with PanDA, warm-started from an AgenticWF knowledge base.
#
# dtlz2_ax_panda.yml plus KB warm start: the first 4 initial samples come from
# the best trials of similar past runs, and each saved batch uploads this run
# to the KB. Shares the "aid2e-dtlz2" KB with dtlz2_ax_joblib_kb.yml, so JobLib
# and PanDA runs warm-start each other (filter on metadata.scheduler to keep
# them apart). Update queue, cloud, and init_env_file for your site. Needs
# agenticwf-kb-client (pip install 'aid2e[kb]') and a KB sign-in:
#   export AGENTICWF_KB_URL=https://aipanda107.cern.ch/app/kb
#   agenticwf login            # or AGENTICWF_TOKEN=pat_...

problem:
  name: "DTLZ2 Ax with PanDA and KB warm start"
  problem_type: "DTLZ2"
  output_location: "./output/ax_panda_kb"
  work_location: "./work/ax_panda_kb"
  design_parameters_file: "../dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    # Fixed hypervolume reference point, shared by all DTLZ2 runs so their
    # hypervolumes can be compared (best possible: 4 - pi/4 = 3.2146).
    objective_thresholds:
      f1: 2.0
      f2: 2.0
    n_initial_samples: 20
    n_iterations: 100
    batch_size: 4
    seed: null              # unseeded Sobol: warm runs explore new points
    kb_warm_start:
      knowledge_base_ids: ["aid2e-dtlz2"]
      description: "DTLZ2, ten variables, two objectives, Ax BoTorch"
      rank_by: "hypervolume" # rank past trials on their hypervolume record (f1 and f2 together)
      n: 4                  # 4 KB points, then 16 Sobol points
      upload_kb_id: "aid2e-dtlz2"  # created if missing
      metadata:
        problem: "DTLZ2"
        scheduler: "panda"

scheduler:
  runner_type: "PanDAiDDSRunner"
  parameters:
    cloud: "US"
    queue: "BNL_PanDA_1"
    source_dir: "."
    source_dir_parent_level: 1
    exclude_source_files:
      - "(^|/)\\..*"  # Hidden files
      - ".*\\.log"
      - ".*\\.json"
      - "__pycache__"
      - "work"
      - "OUTDIR"
    init_env_file: "../schedulers/panda-idds/panda-init-env.yml"
    max_walltime: 1800
    core_count: 1
    total_memory: 4000
  max_retries: 1
  output_location: "./aid2e_panda_scheduler_output"
  monitor_interval: 5

workflows:
  workflows:
    - name: "dtlz2_panda_eval"
      description: "Evaluate DTLZ2 objectives through a PanDA/iDDS Python callable workflow."
      branches:
        - name: "main"
          stages:
            - name: "evaluate"
              parallelism:
                max_concurrent: 1
                retry_max: 0
                timeout_sec: 300
              jobs:
                - name: "dtlz2"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.dtlz2.dtlz2_evaluator:evaluate_qualified_both_objectives"
