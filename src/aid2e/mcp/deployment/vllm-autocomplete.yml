apiVersion: v1
kind: Pod
metadata:
  name: vllm-autocomplete
  namespace: ai4phys
  labels:
    app: vllm-engine
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: userID#
    runAsGroup: userID*#
    fsGroup: userID#
  containers:
    - name: vllm-containter
      image: vllm/vllm-openai:latest
      env:
        - name: USER
          value: "username"
        - name: LOGNAME
          value: "username"
        - name: HOME
          value: "/sciclone/home/username"
        - name: VLLM_CACHE
          value: "/sciclone/scr30/username/.cache/vllm"
        - name: HF_HOME
          value: "/sciclone/scr30/username/.cache/huggingface"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-secret
              key: HF_TOKEN
        - name: HF_XET_HIGH_PERFORMANCE
          value: "1"
      volumeMounts:
        - name: nsf
          mountPath: /sciclone/home/username
        - name: d10
          mountPath: /sciclone/data10/username/
        - name: scr30
          mountPath: /sciclone/scr30/username
        - name: dshm
          mountPath: /dev/shm
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - "--model"
        - "Qwen/Qwen3.5-4B"
        - "--port"
        - "8001"
        - "--tensor-parallel-size"
        - "1"                          # Correct for 1 GPU allocation
        - "--gpu-memory-utilization"
        - "0.90"                       # 90% is great here because this Pod gets its own dedicated GPU
        - "--max-model-len"
        - "65536"                      # 64k is perfect for autocomplete
        - "--enable-prefix-caching"    # <<< CRITICAL: Keeps code context cached on every keystroke
        - "--language-model-only"      # Disables multimodal/vision overhead for pure text speed
        - "--kv-cache-dtype"
        - "fp8"
        - "--enable-chunked-prefill"
        - "--max-num-seqs"
        - "64"                         # <<< INCREASED: Autocomplete demands higher parallel sequence queues
        - "--max-num-batched-tokens"
        - "8192"
        - "--enable-log-requests"
        - "--max-log-len"
        - "200"
        - "--override-generation-config"
        - '{"temperature": 0.0, "top_p": 0.8, "top_k": 10, "repetition_penalty": 1.1}'
      ports:
        - containerPort: 8001
          name: http

      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "16Gi"
          nvidia.com/gpu: "1"
      securityContext:
        runAsUser: 255610
        runAsGroup: 50027
  tolerations:
    - key: "node"
      operator: "Equal"
      value: aiphys
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/hostname: aiphys-node1.sciclone.wm.edu
    nvidia.com/gpu.product: "NVIDIA-L40S"
  volumes:
    - name: nsf
      nfs:
        server: 128.239.56.166
        path: /sciclone/home/username
    - name: d10
      nfs:
        server: 128.239.56.30
        path: /sciclone/data10/username
    - name: scr30
      nfs:
        server: 128.239.56.174
        path: /sciclone/scr30/username
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi

        