# Slurm trial and workflow-job submission; update setup_commands for your cluster.
problem:
  name: "DTLZ2 Slurm Workflow Example"
  problem_type: "DTLZ2"
  output_location: "./output/ax_slurm"
  work_location: "./work/ax_slurm"
  design_parameters_file: "../dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    warm_start_path: null
    generator_kwargs:
      surrogate_spec:
        model_configs:
          - botorch_model_class: "SingleTaskGP"
      botorch_acqf_class: "qLogNoisyExpectedHypervolumeImprovement"
      acquisition_options:
        prune_baseline: true
    generator_gen_kwargs:
      model_gen_options:
        optimizer_kwargs:
          sequential: false
          num_restarts: 10
    objective_thresholds:
      f1: 1.0
      f2: 1.0
    n_initial_samples: 20
    n_iterations: 100
    batch_size: 4
    seed: 42

scheduler:
  runner_type: "SlurmRunner"
  parameters:
    job_name_prefix: "aid2e_cfg"
    runtime_working_dir: "."
    setup_commands:
      - "module load miniforge3/24.9.2-0"
      - "conda activate env_AID2E"
    poll_interval: 2

workflows:
  workflows:
    - name: "dtlz2_slurm_eval"
      description: "Canonical global-scheduler Slurm workflow example"
      branches:
        - name: "main"
          stages:
            - name: "evaluate"
              jobs:
                - name: "compute_dtlz2"
                  command: "python examples/dtlz2/dtlz2_evaluator.py"
                  rule: >-
                    {command}
                    --x1 {payload[x1]}
                    --x2 {payload[x2]}
                    --x3 {payload[x3]}
                    --x4 {payload[x4]}
                    --x5 {payload[x5]}
                    --x6 {payload[x6]}
                    --x7 {payload[x7]}
                    --x8 {payload[x8]}
                    --x9 {payload[x9]}
                    --x10 {payload[x10]}
                    --output {payload[output_file]}
                    --label {payload[label]}
                    --sleep-sec {payload[sleep_sec]}
                    --repeat {payload[repeat]}
                  payload:
                    x1: "{design_point[DTLZ2_variables.x1]}"
                    x2: "{design_point[DTLZ2_variables.x2]}"
                    x3: "{design_point[DTLZ2_variables.x3]}"
                    x4: "{design_point[DTLZ2_variables.x4]}"
                    x5: "{design_point[DTLZ2_variables.x5]}"
                    x6: "{design_point[DTLZ2_variables.x6]}"
                    x7: "{design_point[DTLZ2_variables.x7]}"
                    x8: "{design_point[DTLZ2_variables.x8]}"
                    x9: "{design_point[DTLZ2_variables.x9]}"
                    x10: "{design_point[DTLZ2_variables.x10]}"
                    output_file: "{output_dir}/objectives.json"
                    label: "config-driven-slurm"
                    sleep_sec: 0.3
                    repeat: 2
                  outputs:
                    - path: "{payload[output_file]}"
                      format: "json"
              parallelism:
                max_concurrent: 1
                retry_max: 1
                timeout_sec: 300
