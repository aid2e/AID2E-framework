# Example ePIC Tracking Detector Optimization Configuration
# This demonstrates optimization of ePIC detector parameters with XML integration

problem:
  name: "ePIC Vertex Barrel Optimization"
  problem_type: "EPIC_TRACKING"
  output_location: "/tmp"
  work_location: "/tmp"
  
  epic_environment:
    eic_shell: "$HOME/.local/bin/eic-shell"
    epic_install: "$HOME/epic/install"
    eic_recon_install: "$HOME/epic/install/local"
    epic_config: "epic_full"
  
  inline_design:
    epic_design_space:
      epic_design_parameters:
        vertex_barrel:
          file_path: "$DETECTOR_PATH/compact/tracking/vertex_barrel.xml"
          parameters:
            layer1_radius:
              value: 36.0
              bounds: [30.0, 50.0]
              xml_path: "//constant[@name='VertexBarrel_layer_1_radius']"
              attribute: "value"
              unit: "mm"
            del_layer2_radius:
              value: 15.0
              bounds: [10.0, 25.0]
              xml_path: "//constant[@name='VertexBarrel_delta_layer_2_radius']"
              attribute: "value"
              unit: "mm"
            del_layer3_radius:
              value: 15.0
              bounds: [10.0, 25.0]
              xml_path: "//constant[@name='VertexBarrel_delta_layer_3_radius']"
              attribute: "value"
              unit: "mm"
      optimization_groups:
        vertex_only:
          - "vertex_barrel.layer1_radius"
          - "vertex_barrel.del_layer2_radius"
          - "vertex_barrel.del_layer3_radius"

  objectives:
    - name: "tracking_resolution"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 10
    n_iterations: 50
    batch_size: 4
    seed: 42

scheduler:
  runner_type: "JobLibRunner"
  parameters:
    n_jobs: 1
    backend: "threading"

workflows:
  workflows:
    - name: "epic_tracking_eval"
      stack_type: "epic"
      branches: []
