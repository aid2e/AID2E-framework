problem:
  name: "DTLZ2 Slurm Workflow Example"
  problem_type: "DTLZ2"
  output_location: "/tmp"
  work_location: "/tmp"
  design_parameters_file: "../optimizers/dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 2
    n_iterations: 1
    batch_size: 1
    seed: 7

scheduler:
  runner_type: "SlurmRunner"
  parameters:
    job_name_prefix: "aid2e_cfg"
    runtime_working_dir: "."
    setup_commands:
      - "module load miniforge3/24.9.2-0"
      - "conda activate env_AID2E"
    poll_interval: 2

workflows:
  workflows:
    - name: "dtlz2_slurm_eval"
      description: "Canonical global-scheduler Slurm workflow example"
      objectives:
        - name: "f1"
          direction: "minimize"
        - name: "f2"
          direction: "minimize"
      branches:
        - name: "main"
          stages:
            - name: "evaluate"
              jobs:
                - name: "compute_dtlz2"
                  command: "python examples/dtlz2/complete/scripts/slurm_dtlz2_from_cli.py"
                  rule: >-
                    {command}
                    --x1 {payload[x1]}
                    --x2 {payload[x2]}
                    --x3 {payload[x3]}
                    --x4 {payload[x4]}
                    --x5 {payload[x5]}
                    --output {payload[output_file]}
                    --label {payload[label]}
                    --sleep-sec {payload[sleep_sec]}
                    --repeat {payload[repeat]}
                  payload:
                    x1: "{design_point[DTLZ2_variables.x1]}"
                    x2: "{design_point[DTLZ2_variables.x2]}"
                    x3: "{design_point[DTLZ2_variables.x3]}"
                    x4: "{design_point[DTLZ2_variables.x4]}"
                    x5: "{design_point[DTLZ2_variables.x5]}"
                    output_file: "{output_dir}/objectives.json"
                    label: "config-driven-slurm"
                    sleep_sec: 0.3
                    repeat: 2
                  outputs:
                    - path: "{payload[output_file]}"
                      format: "json"
              parallelism:
                max_concurrent: 1
                retry_max: 1
                timeout_sec: 300
