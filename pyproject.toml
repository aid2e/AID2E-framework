[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aid2e"
version = "0.0.1"
description = "AID2E Framework: AI assisted Detector Design for EIC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AID2E Team", email = "ksuresh@wm.edu"}
]
keywords = [
    "optimization",
    "bayesian",
    "evolutionary-algorithms",
    "multi-objective",
    "hyperparameter-tuning",
    "ePIC"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pyyaml>=5.4",
    "pydantic>=2.0",
    "click>=8.0",
    "ax-platform==1.0.0",
]

[project.optional-dependencies]
mobo = ["scikit-learn>=0.24"]
moea = ["pymoo>=0.6"]
joblib = ["joblib>=1.0"]
slurm = [
    "submitit>=1.4",
    "pyclusters>=1.0",
]
panda = [
    "wheel",
    "idds-common>=2.0",
    "idds-workflow>=2.0",
    "panda-client>=1.5",
]

dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
    "isort>=5.9",
    "mypy>=0.910",
]

docs = [
    "mkdocs>=1.2",
    "mkdocs-material>=7.1",
    "mkdocstrings>=0.18",
    "mkdocstrings-python>=1.0.0",
]

[project.urls]
Homepage = "https://aid2e.github.io/aid2e"
Documentation = "https://aid2e.github.io/AID2E-framework"
Repository = "https://github.com/aid2e/AID2E-framework.git"
Issues = "https://github.com/aid2e/AID2E-framework/issues"

[project.scripts]
aid2e = "aid2e.cli.aid2e_cli:cli"

[tool.setuptools]
packages = ["aid2e", "aid2e.cli", "aid2e.optimizers", "aid2e.schedulers", "aid2e.utilities", "aid2e.utilities.configurations", "aid2e.utilities.epic_utils"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"aid2e" = ["py.typed"]
"aid2e.cli" = ["py.typed"]
"aid2e.optimizers" = ["py.typed"]
"aid2e.schedulers" = ["py.typed"]
"aid2e.utilities" = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_mode = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=html --cov-report=term-missing"
