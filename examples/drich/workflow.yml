# This example shows:
#   1. Optimization with Ax (Sobol warmup + BO)
#   2. Multi-objective dRICH optimization:
#        maximize pi/K separation and acceptance
#   3. ePIC workflow chain: geo -> sim_rec -> ana
# ============================================================================

# Problem definition
problem:
  name: "dRICH Optimization"
  problem_type: "EPIC_dRICH"
  description: "Optimization of dRICH"

  output_location: "./output"
  work_location: "./work"

  design_parameters_file: "./design.params"

  objectives:
    - name: "piKsep_etalow"
      direction: "maximize"
    - name: "piKsep_etahigh"
      direction: "maximize"
    - name: "acceptance"
      direction: "maximize"

  epic_environment:
    epic_install: "./work/eic-software"
    epic_config: "epic_craterlake"
    geometry_mode: "no_build"
    eic_shell: "./work/eic-shell"
    eic_recon_install: "./work/eic-software/share/epic/local"

  evaluation_config:
    npart: 500
    bootstrap_samples: 50
    nbootstraps: 50
    particles: ["pi+", "kaon+"]
    analysis_executable: "script/dRICHAna_bootstrap"
    output_name: "drich_optimization_toy"
    scan_points:
      - {p: 15, eta_min: 1.5, eta_max: 2.0, radiator: 0}
      - {p: 15, eta_min: 2.0, eta_max: 2.5, radiator: 0}
      - {p: 45, eta_min: 2.5, eta_max: 3.0, radiator: 1}
      - {p: 45, eta_min: 3.0, eta_max: 3.5, radiator: 1}

    trial_failure_policy: "penalty" # penalty/fail
    max_failed_trials: 5
    penalty_objectives:
      piKsep_etalow: 0.0
      piKsep_etahigh: 0.0
      acceptance: 0.0

# Optimizer configuration
optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    seed: 999

    generator: "BOTORCH_MODULAR"
    objective_thresholds:
      piKsep_etalow: 3.62
      piKsep_etahigh: 4.04
      acceptance: 0.80

    n_initial_samples: 10 # n_sobol
    n_iterations: 50
    batch_size: 5 # n_batch_sobol = n_batch_mobo

# Global scheduler configuration
scheduler:
  runner_type: "JobLibRunner" # JobLibRunner, SlurmRunner, PanDAiDDSRunner
  parameters:
    n_jobs: 2
    backend: "loky"

# Workflow execution
workflows:
  workflows:
    - name: "drich_workflow"
      description: "dRICH evaluation workflow"
      stack_type: "epic"

      branches:
        - name: "main"
          scheduler:
            runner_type: "SlurmRunner"
            parameters: &drich_stage_slurm
              job_name_prefix: "drich"
              account: "<account>"
              partition: "<partition>"
              nodes: 1
              ntasks: 1
              cpus_per_task: 1
              mem: "4G"
              time: "04:00:00"
              poll_interval: 10
              capture_stdout: true
              capture_stderr: true
          stages:
            - name: "geo"
              # Edit trial XML and run checkOverlaps.
              scheduler:
                runner_type: "JobLibRunner"
                parameters:
                  n_jobs: 1
                  backend: "threading"
              jobs:
                - name: "drich_geo"
                  payload:
                    evaluator_type: "stack"
                  layers:
                    - layer: "geo"
                      inputs:
                        - "{{geometry_dir}}/${DETECTOR_CONFIG}.xml"
                      outputs:
                        - "{{workflow[log_dir]}}/overlap_log_{{workflow[trial_index]}}.txt"

            - name: "sim_rec"
              # Run npsim and then eicrecon in the same job
              jobs:
                - name: "drich_sim_rec"
                  payload:
                    evaluator_type: "stack"
                  layers:
                    - layer: "sim"
                      inputs: []
                      outputs:
                        - "{{payload[sim_file]}}"
                      arguments:
                        - "--compactFile"
                        - "{{geometry_dir}}/${DETECTOR_CONFIG}.xml"
                        - "-G"
                        - "-N {{payload[npart]}}"
                        - "--gun.etaMax {{payload[eta_max]}}"
                        - "--gun.etaMin {{payload[eta_min]}}"
                        - "--gun.phiMin 0"
                        - "--gun.phiMax 6.2831853"
                        - "--gun.momentumMax '{{payload[p]}}*GeV'"
                        - "--gun.momentumMin '{{payload[p]}}*GeV'"
                        - "--gun.particle {{payload[particle]}}"
                        - "--gun.distribution eta"
                      rule: "{{command}} {{arguments}} {{inputs}} {{outputs}}"
                    - layer: "rec"
                      inputs:
                        - "{{payload[sim_file]}}"
                      outputs:
                        - "{{payload[reco_file]}}"
                      arguments:
                        - "-Pdd4hep:xml_files={{geometry_dir}}/${DETECTOR_CONFIG}.xml"
                        - "-Ppodio:output_include_collections=DRICHHits,MCParticles,DRICHRawHits,DRICHRawHitsAssociations,DRICHAerogelTracks,DRICHGasTracks,DRICHAerogelIrtCherenkovParticleID,DRICHGasIrtCherenkovParticleID,DRICHMergedIrtCherenkovParticleID"
              job_factory:
                type: "payloads"
                params:
                  from: "drich_utils:sim_rec_payloads"

            - name: "ana"
              # Run analysis once per scan point using pi+/kaon+ reco files.
              jobs:
                - name: "drich_ana"
                  payload:
                    evaluator_type: "stack"
                  layers:
                    - layer: "ana"
                      inputs:
                        - "{{payload[ana_inputs]}}"
                      outputs:
                        - "{{payload[analysis_output]}}"
                      arguments:
                        - "{{payload[radiator]}}"
                        - "{{payload[bootstrap_samples]}}"
                        - "{{payload[nbootstraps]}}"
                      command: "{{workflow[config_dir]}}/script/dRICHAna_bootstrap"
                      rule: "{{command}} {{inputs}} {{outputs}} {{arguments}}"
              job_factory:
                type: "payloads"
                params:
                  from: "drich_utils:ana_payloads"

            - name: "collect_objectives"
              objective_plan:
                steps:
                  stages:
                    - name: "merge"
                      inline:
                        entrypoint: "drich_utils:aggregate_objectives"
                      produces_objective: true
