[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aid2e-schedulers"
version = "0.0.1"
description = "Job schedulers for AID2E Framework (JobLib, SLURM, Panda)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AID2E Team", email = "ksuresh@wm.edu"}
]
keywords = ["scheduling", "joblib", "slurm", "panda", "distributed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.optional-dependencies]
joblib = ["joblib>=1.0"]
slurm = ["pyclusters>=1.0"]
panda = ["panda-client>=1.0"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
]
docs = ["mkdocs>=1.2", "mkdocs-material>=7.1"]

[project.urls]
Homepage = "https://aid2e.github.io/aid2e"
Repository = "https://github.com/aid2e/AID2E-framework.git"

[tool.setuptools]
packages = ["schedulers"]
package-dir = {"" = "src"}
