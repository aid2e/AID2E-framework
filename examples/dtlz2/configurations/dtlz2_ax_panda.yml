# PanDA callable submission; update queue, cloud, and init_env_file for your site.

problem:
  name: "DTLZ2 Ax with PanDA"
  problem_type: "DTLZ2"
  output_location: "./output/ax_panda"
  work_location: "./work/ax_panda"
  design_parameters_file: "../dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    warm_start_path: null
    n_initial_samples: 20
    n_iterations: 100
    batch_size: 4
    seed: 42

scheduler:
  runner_type: "PanDAiDDSRunner"
  parameters:
    cloud: "US"
    queue: "BNL_PanDA_1"
    source_dir: "."
    source_dir_parent_level: 1
    exclude_source_files:
      - "(^|/)\\..*"  # Hidden files
      - ".*\\.log"
      - ".*\\.json"
      - "__pycache__"
      - "work"
      - "OUTDIR"
    init_env_file: "../schedulers/panda-idds/panda-init-env.yml"
    max_walltime: 1800
    core_count: 1
    total_memory: 4000
  max_retries: 1
  output_location: "./aid2e_panda_scheduler_output"
  monitor_interval: 5

workflows:
  workflows:
    - name: "dtlz2_panda_eval"
      description: "Evaluate DTLZ2 objectives through a PanDA/iDDS Python callable workflow."
      branches:
        - name: "main"
          stages:
            - name: "evaluate"
              parallelism:
                max_concurrent: 1
                retry_max: 0
                timeout_sec: 300
              jobs:
                - name: "dtlz2"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.dtlz2.dtlz2_evaluator:evaluate_qualified_both_objectives"
