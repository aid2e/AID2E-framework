# DTLZ2 + Ax + PanDA/iDDS dataset-dependency template for Phase 5.
#
# This mirrors the scheduler_epic dataset handoff pattern more closely than
# input-panda-multistep.yml. It is intended for real PanDA/iDDS smoke testing:
# N sim/reco PanDA works write output datasets, N ana PanDA works consume the
# matching datasets through parent_internal_id, and one local final step
# aggregates ana results. Dataset names use AID2E placeholders resolved before iDDS/Rucio registration.

problem:
  name: "DTLZ2 CLI PanDA Multi-Step Dataset Smoke Test"
  problem_type: "DTLZ2"
  output_location: "/tmp"
  work_location: "/tmp"
  design_parameters_file: "examples/optimizers/dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 1
    n_iterations: 1
    batch_size: 1
    seed: 7

scheduler:
  runner_type: "PanDAiDDSRunner"
  parameters:
    cloud: "US"
    queue: "BNL_PanDA_1"
    source_dir: "."
    source_dir_parent_level: 1
    exclude_source_files:
      - '(^|/)\..*'
      - '.*\.log'
      - '.*\.json'
      - "__pycache__"
      - "work"
      - "OUTDIR"
    init_env_file: "panda-init-env.yml"
    max_walltime: 1800
    core_count: 1
    total_memory: 4000
  max_retries: 1
  output_location: "./aid2e_panda_scheduler_output"
  monitor_interval: 5

workflows:
  workflows:
    - name: "dtlz2_panda_multistep_dataset_eval"
      description: "Dataset-backed PanDA/iDDS multi-step template: simreco datasets feed matching ana jobs."
      branches:
        - name: "main"
          stages:
            - name: "evaluate"
              parallelism:
                max_concurrent: 1
                retry_max: 0
                timeout_sec: 600
              jobs:
                - name: "dtlz2_multistep_datasets"
                  command: ""
                  payload:
                    evaluator_type: "panda_multistep"
                    steps:
                      - name: "simreco"
                        python_callable: "examples.evaluators.dtlz2:panda_multistep_simreco"
                        return_func_results: false
                        with_output_dataset: true
                        output_file: "my_test.txt"
                        output_dataset: "#panda_scope.aid2e.dtlz2.simreco.#job_id"
                        num_events: 200
                        num_events_per_job: 100
                        children:
                          - key: "eta_0p1_pi"
                            op_kwargs:
                              particle: "pi+"
                              eta_point: 0.1
                          - key: "eta_0p1_kaon"
                            op_kwargs:
                              particle: "kaon+"
                              eta_point: 0.1

                      - name: "ana"
                        python_callable: "examples.evaluators.dtlz2:panda_multistep_ana"
                        depends_on: "simreco"
                        dep_type: "datasets"
                        dep_map: "one2one"
                        with_input_datasets: true
                        input_datasets:
                          input_file_names: "#panda_scope.aid2e.dtlz2.simreco.#job_id"

                      - name: "final"
                        python_callable: "examples.evaluators.dtlz2:panda_multistep_final"
                        depends_on: "ana"
                        dep_type: "results"
                        dep_map: "all2one"
                        runner: "local"
                        parent_result_parameter_name: "ana_results"
                        final: true
