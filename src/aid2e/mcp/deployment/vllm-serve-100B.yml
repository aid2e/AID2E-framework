apiVersion: v1
kind: Pod
metadata:
  name: vllm-serve
  namespace: ai4phys
  labels:
    app: vllm-engine
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: userID#
    runAsGroup: groupID#
    fsGroup: groupID#
  containers:
    - name: vllm-containter
      image: vllm/vllm-openai:latest
      env:
        - name: USER
          value: "username"
        - name: LOGNAME
          value: "username"
        - name: HOME
          value: "/sciclone/home/username"
        - name: VLLM_CACHE
          value: "/sciclone/scr30/username/.cache/vllm"
        - name: HF_HOME
          value: "/sciclone/scr30/username/.cache/huggingface"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: huggingface-secret
              key: HF_TOKEN
        - name: HF_XET_HIGH_PERFORMANCE
          value: "1"
      volumeMounts:
        - name: nsf
          mountPath: /sciclone/home/username
        - name: d10
          mountPath: /sciclone/data10/username/
        - name: scr30
          mountPath: /sciclone/scr30/username
        - name: dshm
          mountPath: /dev/shm
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - "--model"
        - "Qwen/Qwen3.5-122B-A10B-FP8"
        - "--chat_template"
        - "/sciclone/data10/username/AID2E_Chat_Tools/aid2e_chat_template.jinja"
        - "--enable-prefix-caching"
        - "--port"
        - "8000"
        - "--gpu-memory-utilization"
        - "0.90"
        - "--max-model-len"
        - "65536"
        - "--tensor-parallel-size"
        - "4"
        - "--trust-remote-code"
        - "--enable-auto-tool-choice"
        - "--tool-call-parser"
        - "qwen3_xml"
        - "--reasoning-parser"
        - "qwen3"
        - "--language-model-only"
        - "--kv-cache-dtype"
        - "fp8"
        - "--enable-chunked-prefill"
        - "--max-num-seqs"
        - "32"
        - "--max-num-batched-tokens"
        - "8192"
        - "--enable-log-requests"
        - "--max-log-len"
        - "200"
        - "--override-generation-config"
        - '{"temperature": 1.0, "top_p": 0.95, "top_k": 20, "frequency_penalty": 0.3, "repetition_penalty": 1.0}'
      ports:
        - containerPort: 8000
          name: http

      resources:
        requests:
          cpu: "32"
          memory: "256Gi"
          nvidia.com/gpu: "4"
        limits:
          cpu: "32"
          memory: "256Gi"
          nvidia.com/gpu: "4"
      securityContext:
        runAsUser: 255610
        runAsGroup: 50027
  tolerations:
    - key: "node"
      operator: "Equal"
      value: aiphys
      effect: "NoSchedule"
  nodeSelector:
    kubernetes.io/hostname: aiphys-node1.sciclone.wm.edu
    nvidia.com/gpu.product: "NVIDIA-L40S"
  volumes:
    - name: nsf
      nfs:
        server: 128.239.56.166
        path: /sciclone/home/username
    - name: d10
      nfs:
        server: 128.239.56.30
        path: /sciclone/data10/username
    - name: scr30
      nfs:
        server: 128.239.56.174
        path: /sciclone/scr30/username
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 4Gi

        