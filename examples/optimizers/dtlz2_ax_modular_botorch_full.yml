metadata:
  project: AID2E
  description: Full-config DTLZ2 Ax optimization using Modular BoTorch backend
  version: 0.0.0
  results_file: examples/optimizers/output/dtlz2_ax_modular_botorch_results.json

problem:
  name: "DTLZ2 Multi-Objective Optimization"
  type: "toy"
  output_location: "/tmp"
  work_location: "/tmp"
  design_parameters_file: "../basic/design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "center"   # valid: uniform | sobol | center
    generator: "BOTORCH_MODULAR"
    generator_kwargs:
      botorch_acqf_class: "qLogNoisyExpectedHypervolumeImprovement"
      acquisition_options:
        prune_baseline: true
    generator_gen_kwargs:
      model_gen_options:
        optimizer_kwargs:
          num_restarts: 10
          sequential: false
          options:
            batch_limit: 5
            maxiter: 100
    objective_thresholds:
      f1: 1.0
      f2: 1.0
    n_initial_samples: 6
    n_iterations: 4
    batch_size: 2
    seed: 42

scheduler:
  runner_type: "JobLibRunner"
  parameters:
    n_jobs: 2
    backend: "loky"
    timeout: 120
    verbose: 0

workflows:
  workflows:
    - name: "dtlz2_ax_modular_single_branch"
      description: "Single-branch DTLZ2 workflow for Ax Modular BoTorch"
      objectives:
        - name: "f1"
          direction: "minimize"
        - name: "f2"
          direction: "minimize"
      branches:
        - name: "main"
          stages:
            - name: "evaluate"
              jobs:
                - name: "compute_objectives"
                  command: "python"
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2:evaluate_both_objectives_wrapper"
                    op_args: []
                    op_kwargs: {}
