# ============================================================================
# ePIC dRICH Optimization
# ============================================================================
# This example shows:
#   1. Optimization with Ax (Sobol warmup + BO)
#   2. Multi-objective dRICH optimization:
#        maximize pi/K separation and acceptance
#   3. ePIC workflow chain: geo -> sim_rec -> ana -> retrieve_results
# ============================================================================

# ============================================================================
# SECTION 1: PROBLEM DEFINITION
# ============================================================================
problem:
  name: "dRICH Optimization"
  problem_type: "EPIC_dRICH"
  description: "Optimization of dRICH"

  output_location: "./output"
  work_location: "./work"

  # Design space parameters
  design_parameters_file: "./design.params"

  # OBJECTIVES:
  # ===========================================================================
  objectives:
    - name: "piKsep_etalow"
      direction: "maximize"
    - name: "piKsep_etahigh"
      direction: "maximize"
    - name: "acceptance"
      direction: "maximize"

  # AID2E ePIC environment configuration
  # ===========================================================================
  epic_environment:
    epic_install: "/hpc/group/vossenlab/cn95/AIDE/AID2E-framework/eic-software"
    epic_config: "epic_craterlake"
    eic_shell: "/hpc/group/vossenlab/cn95/AIDE/AID2E-framework/eic-shell"
    eic_recon_install: "/hpc/group/vossenlab/cn95/AIDE/AID2E-framework/eic-software/share/epic/local"

  # pipeline configuration
  # ===========================================================================
  evaluation_config:
    npart: 5
    bootstrap_samples: 10
    nbootstraps: 10
    particles: ["pi+", "kaon+"]
    analysis_executable: "script/dRICHAna_bootstrap"
    output_name: "drich_optimization_toy"
    reco_collections: "DRICHHits,MCParticles,DRICHRawHits,DRICHRawHitsAssociations,DRICHAerogelTracks,DRICHGasTracks,DRICHAerogelIrtCherenkovParticleID,DRICHGasIrtCherenkovParticleID,DRICHMergedIrtCherenkovParticleID"
    scan_points:
      - {p: 15, eta_min: 1.5, eta_max: 2.0, radiator: 0}
      - {p: 15, eta_min: 2.0, eta_max: 2.5, radiator: 0}
      - {p: 45, eta_min: 2.5, eta_max: 3.0, radiator: 1}
      - {p: 45, eta_min: 3.0, eta_max: 3.5, radiator: 1}

    # Overlap policy:
    overlap_ok_value: 0
    failure_policy: "penalty" # penalty | fail
    max_failed_trials: 5
    failed_objectives:
      piKsep_etalow: 0.0
      piKsep_etahigh: 0.0
      acceptance: 0.0

# SECTION 2: OPTIMIZER CONFIGURATION
# ============================================================================
optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    seed: 999

    generator: "BOTORCH_MODULAR"
    objective_thresholds:
      piKsep_etalow: 3.62
      piKsep_etahigh: 4.04
      acceptance: 0.80

    n_initial_samples: 4 # n_sobol
    n_iterations: 16
    batch_size: 2 # n_batch_sobol = n_batch_mobo

# SECTION 3: SCHEDULER CONFIGURATION (global)
# ============================================================================
scheduler:
  runner_type: "SlurmRunner" # JobLibRunner, SlurmRunner, PanDAiDDSRunner
  parameters:
    job_name_prefix: "drich"
    account: "vossenlab"
    partition: "scavenger"
    nodes: 1
    ntasks: 1
    cpus_per_task: 1
    mem: "2G"
    time: "04:00:00"
    poll_interval: 10
    capture_stdout: true
    capture_stderr: true

# SECTION 4: WORKFLOW EXECUTION
# ============================================================================
workflows:
  workflows:
    - name: "drich_eval"
      description: "dRICH evaluation workflow"

      # BRANCHES: parallel execution paths
      # ======================================================================
      branches:
        - name: "main"
          # STAGES: sequential steps in the workflow, executed in order.
          # Each stage can have one or more jobs, which can be executed in parallel.
          # ==================================================================
          stages:
            - name: "geo"
              # Edit trial XML and run checkOverlaps.
              jobs:
                - name: "drich_geo"
                  command: &drich_command "python examples/drich/drich_eval.py"
                  rule: &drich_rule_no_job_index "{command} --stage {stage_name} --trial-index {trial_index} --output-dir {output_dir} --config-path {config_path}"

            - name: "sim_rec"
              # Run npsim and then eicrecon in the same job
              # Can optionally split up sim and rec
              scheduler:
                runner_type: "SlurmRunner"
                parameters:
                  account: "vossenlab"
                  partition: "scavenger"
                  nodes: 1
                  ntasks: 1
                  cpus_per_task: 1
                  mem: "4G"
                  time: "04:00:00"
              jobs:
                - name: "drich_sim_rec"
                  command: *drich_command
                  rule: &drich_rule_with_job_index "{command} --stage {stage_name} --job-index {job_index} --trial-index {trial_index} --output-dir {output_dir} --config-path {config_path}"
              job_factory:
                type: "range"
                params:
                  n: 8

            - name: "ana"
              # Run analysis once per scan point using pi+/kaon+ reco files.
              scheduler:
                runner_type: "SlurmRunner"
                parameters:
                  account: "vossenlab"
                  partition: "scavenger"
                  nodes: 1
                  ntasks: 1
                  cpus_per_task: 1
                  mem: "4G"
                  time: "04:00:00"
              jobs:
                - name: "drich_ana"
                  command: *drich_command
                  rule: *drich_rule_with_job_index
              job_factory:
                type: "range"
                params:
                  n: 4

            - name: "retrieve_results"
              # Read analysis outputs and compute objectives.
              jobs:
                - name: "drich_retrieve_results"
                  command: *drich_command
                  rule: *drich_rule_no_job_index
                  outputs:
                    - path: "{output_dir}/log/results/drich-out_{trial_tag}.json"
                      format: "json"
