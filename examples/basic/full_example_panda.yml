# AID2E Full Example Configuration with PanDA iDDS Distributed Scheduler
# This example demonstrates using the PanDA iDDS runner for distributed execution across sites

problem:
  name: "DTLZ2 Multi-Objective Optimization with PanDA iDDS"
  problem_type: "toy"
  output_location: "/tmp"
  work_location: "/tmp"

  objectives:
    - name: "f1"
      direction: "minimize"
      computation:
        multi_steps:
          stages:
            - name: "evaluate_f1"
              script:
                path: "scripts/dtlz2_problem.py"
                output_file: "objectives_{job_id}.json"
                timeout_sec: 600
              produces_objective: true
      metrics_keys: ["f1"]
    - name: "f2"
      direction: "minimize"
      computation:
        multi_steps:
          stages:
            - name: "evaluate_f2"
              script:
                path: "scripts/dtlz2_problem.py"
                output_file: "objectives_{job_id}.json"
                timeout_sec: 600
              produces_objective: true
      metrics_keys: ["f2"]

  design_parameters_file: "design.params"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 24
    n_iterations: 100
    batch_size: 4
    seed: 42

# Scheduler configuration for distributed execution using PanDA iDDS
scheduler:
  runner_type: "PanDAiDDSRunner"
  parameters:
    cloud: null
    task_type: "optimization"
    max_walltime: 7200  # 2 hour timeout per task
  max_retries: 5
  output_location: "./panda_output"
  monitor_interval: 120  # Check distributed job status every 120 seconds

metadata:
  project: "AID2E"
  description: "AI assisted Detector Design for EIC - Distributed Execution"
  version: "0.0.1"
