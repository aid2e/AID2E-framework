# AID2E Full Example Configuration with JobLib Local Scheduler
# This example demonstrates using the JobLib runner for local parallel execution

problem:
  name: "DTLZ2 Multi-Objective Optimization"
  problem_type: "toy"
  output_location: "/tmp"
  work_location: "/tmp"

  objectives:
    - name: "f1"
      direction: "minimize"
      computation:
        multi_steps:
          stages:
            - name: "evaluate_f1"
              script:
                path: "scripts/dtlz2_problem.py"
                output_file: "objectives_{job_id}.json"
                timeout_sec: 600
              produces_objective: true
      metrics_keys: ["f1"]
    - name: "f2"
      direction: "minimize"
      computation:
        multi_steps:
          stages:
            - name: "evaluate_f2"
              script:
                path: "scripts/dtlz2_problem.py"
                output_file: "objectives_{job_id}.json"
                timeout_sec: 600
              produces_objective: true
      metrics_keys: ["f2"]

  design_parameters_file: "design.params"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 24
    n_iterations: 100
    batch_size: 4
    seed: 42

# Scheduler configuration for local execution using JobLib
scheduler:
  runner_type: "JobLibRunner"
  parameters:
    n_jobs: -1  # Use all available processors
    backend: "loky"  # Use loky backend for robust multiprocessing
    timeout: 3600  # 1 hour timeout per job
    verbose: 1
  max_retries: 3
  output_location: "./joblib_output"
  monitor_interval: 30

metadata:
  project: "AID2E"
  description: "AI assisted Detector Design for EIC"
  version: "0.0.1"
