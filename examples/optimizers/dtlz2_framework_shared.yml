metadata:
  project: AID2E
  description: Shared DTLZ2 framework configuration for optimizer-focused examples

problem:
  name: "DTLZ2 Shared Framework Example"
  type: "toy"
  output_location: "/tmp"
  work_location: "/tmp"
  design_parameters_file: "./dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

scheduler:
  runner_type: "JobLibRunner"
  parameters:
    n_jobs: 1
    backend: "loky"
    timeout: 120
    verbose: 0

workflows:
  workflows:
    - name: "dtlz2_optimizer_framework"
      description: "Single-branch DTLZ2 workflow shared by Ax and PyMOO examples"
      objectives:
        - name: "f1"
          direction: "minimize"
        - name: "f2"
          direction: "minimize"
      branches:
        - name: "main"
          stages:
            - name: "evaluate"
              jobs:
                - name: "compute_objectives"
                  command: "python"
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2:evaluate_both_objectives_wrapper"
                    op_args: []
                    op_kwargs: {}
