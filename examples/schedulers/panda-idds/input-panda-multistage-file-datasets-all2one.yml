# PanDA/iDDS all-to-one dataset example with local objective finalization.
#
# Intended command:
#
#   aid2e optimize examples/schedulers/panda-idds/input-panda-multistage-file-datasets-all2one.yml
#
# For each optimizer trial, two sim/reco PanDA works produce separate datasets.
# One ana PanDA work consumes files from both datasets using an all2one mapping.
# A local JobLib-designated final stage converts the aggregate ana result and
# trial design point into the DTLZ2 objectives f1 and f2.

problem:
  name: "DTLZ2 CLI PanDA Multi-Stage All-To-One Dataset Test"
  problem_type: "DTLZ2"
  output_location: "/tmp"
  work_location: "/tmp"
  design_parameters_file: "../../optimizers/dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 2
    n_iterations: 6
    batch_size: 2
    seed: 7

scheduler:
  runner_type: "PanDAiDDSRunner"
  parameters:
    cloud: "US"
    queue: "BNL_PanDA_1"
    source_dir: "."
    source_dir_parent_level: 1
    exclude_source_files:
      - '(^|/)\..*'
      - '.*\.log'
      - '.*\.json'
      - "__pycache__"
      - "work"
      - "OUTDIR"
    init_env_file: "panda-init-env.yml"
    max_walltime: 1800
    core_count: 1
    total_memory: 4000
  max_retries: 1
  output_location: "./aid2e_panda_scheduler_output"
  monitor_interval: 5

workflows:
  workflows:
    - name: "dtlz2_panda_multistage_file_all2one"
      description: "Two PanDA simreco datasets feed one PanDA ana job, followed by local DTLZ2 finalization."
      branches:
        - name: "main"
          stages:
            - name: "simreco"
              parallelism:
                max_concurrent: 2
                retry_max: 0
                timeout_sec: 600
              jobs:
                - name: "eta_0p1_pi"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_simreco"
                    output_file: "my_test.txt"
                    output_dataset: "{panda_scope}.aid2e.dtlz2.datasets.all2one.{submission_id}.{workflow_id}.{stage_id}.{job_id}"
                    num_events: 100
                    num_events_per_job: 100
                    op_kwargs:
                      particle: "pi+"
                      eta_point: 0.1

                - name: "eta_0p2_kaon"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_simreco"
                    output_file: "my_test.txt"
                    output_dataset: "{panda_scope}.aid2e.dtlz2.datasets.all2one.{submission_id}.{workflow_id}.{stage_id}.{job_id}"
                    num_events: 100
                    num_events_per_job: 100
                    op_kwargs:
                      particle: "kaon+"
                      eta_point: 0.2

            - name: "ana"
              parallelism:
                max_concurrent: 1
                retry_max: 0
                timeout_sec: 600
              jobs:
                - name: "aggregate_simreco"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_ana"
                    depends_on:
                      stage: "simreco"
                      jobs: "*"
                    dep_type: "datasets"
                    dep_map: "all2one"
                    input_datasets:
                      input_file_names:
                        - "{panda_scope}.aid2e.dtlz2.datasets.all2one.{submission_id}.{workflow_id}.simreco.eta_0p1_pi"
                        - "{panda_scope}.aid2e.dtlz2.datasets.all2one.{submission_id}.{workflow_id}.simreco.eta_0p2_kaon"

            - name: "final"
              scheduler:
                runner_type: "JobLibRunner"
                parameters:
                  n_jobs: 1
              parallelism:
                max_concurrent: 1
                retry_max: 0
                timeout_sec: 600
              jobs:
                - name: "final_objectives"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_final"
                    depends_on:
                      stage: "ana"
                      jobs: "*"
                    dep_type: "results"
                    dep_map: "one2one"
                    parent_result_parameter_name: "ana_result"
                    produces_objective: true
