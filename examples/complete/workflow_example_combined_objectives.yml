# DTLZ2 combined-objective full config.
# One workflow objective plan emits both f1 and f2.
# Run with: aid2e optimize examples/complete/workflow_example_combined_objectives.yml

problem:
  name: "DTLZ2 Multi-Objective Optimization"
  problem_type: "toy"
  output_location: "/tmp"
  work_location: "/tmp"
  inline_design:
    design_space:
      design_parameters:
        DTLZ2_variables:
          parameters:
            x1: {value: 0.5, bounds: [0.0, 1.0]}
            x2: {value: 0.5, bounds: [0.0, 1.0]}
            x3: {value: 0.5, bounds: [0.0, 1.0]}
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 4
    n_iterations: 8
    batch_size: 2
    seed: 42

scheduler:
  runner_type: "JobLibRunner"
  parameters:
    n_jobs: 2
    backend: "threading"

workflows:
  workflows:
    - name: "dtlz2_combined_eval"
      branches: []
      combined_objectives:
        - name: "dtlz2_objectives"
          objective_plan:
            steps:
              stages:
                - name: "evaluate"
                  inline:
                    entrypoint: "examples.evaluators.dtlz2:objective_payload"
                  produces_objective: true
          metrics:
            - name: "f1"
              direction: "minimize"
              metric_key: "f1"
            - name: "f2"
              direction: "minimize"
              metric_key: "f2"
