problem:
  name: "DTLZ2 Optimizer-Only PyMOO Example"
  problem_type: "toy"
  output_location: "/tmp"
  work_location: "/tmp"
  design_parameters_file: "./dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "pymoo"
  type: "evolutionary"
  parameters:
    pop_size: 8
    n_offsprings: 8
    crossover_prob: 0.9
    crossover_eta: 15.0
    mutation_eta: 20.0
    n_iterations: 4
    seed: 42
    verbose: false
