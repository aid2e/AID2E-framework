# AID2E Full Example Configuration (DTLZ2 Toy Problem)
# Run with: aid2e optimize examples/basic/full_example.yml

problem:
  name: "DTLZ2 Multi-Objective Optimization"
  problem_type: "toy"
  output_location: "/tmp"
  work_location: "/tmp"
  design_parameters_file: "design.params"

  objectives:
    - name: "f1"
      direction: "minimize"
      objective_plan:
        steps:
          stages:
            - name: "evaluate"
              inline:
                entrypoint: "examples.evaluators.dtlz2:objective_payload"
              produces_objective: true
      metrics_keys: ["f1"]
    - name: "f2"
      direction: "minimize"
      objective_plan:
        steps:
          stages:
            - name: "evaluate"
              inline:
                entrypoint: "examples.evaluators.dtlz2:objective_payload"
              produces_objective: true
      metrics_keys: ["f2"]

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 4
    n_iterations: 8
    batch_size: 2
    seed: 42

scheduler:
  runner_type: "JobLibRunner"
  parameters:
    n_jobs: 2
    backend: "threading"

workflows:
  workflows:
    - name: "dtlz2_eval"
      branches: []

metadata:
  project: "AID2E"
  description: "AI assisted Detector Design for EIC"
  version: "0.0.1"
