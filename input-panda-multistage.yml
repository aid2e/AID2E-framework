# DTLZ2 + Ax + PanDA/iDDS stage-native dataset-dependency template.
#
# This is the issue-61 target shape: sim/reco, analysis, and final objective
# calculation are separate AID2E stages. Stage dependencies are declared in job
# payload metadata so the PanDA/iDDS scheduler can translate them into
# parent_internal_id, output dataset, and input dataset contracts. The dataset
# dependency shape follows scheduler_epic's tested pattern: sim/reco and ana use
# matching one2one child keys, and the local final stage performs all2one result
# fan-in.
#
# Intended command:
#
#   aid2e optimize input-panda-multistage.yml
#
# Note: PanDAiDDSScheduler now detects optimizer trial wrapper jobs for this
# shape and packages these stage records into a scheduler-local
# panda_multistage_graph payload. DAGExecutor remains scheduler-agnostic.

problem:
  name: "DTLZ2 CLI PanDA Multi-Stage Dataset Smoke Test"
  problem_type: "DTLZ2"
  output_location: "/tmp"
  work_location: "/tmp"
  design_parameters_file: "examples/optimizers/dtlz2_design.params"
  objectives:
    - name: "f1"
      direction: "minimize"
    - name: "f2"
      direction: "minimize"

optimizer:
  name: "ax"
  type: "bayesian"
  parameters:
    initialization_strategy: "sobol"
    generator: "BOTORCH_MODULAR"
    n_initial_samples: 1
    n_iterations: 1
    batch_size: 1
    seed: 7

scheduler:
  runner_type: "PanDAiDDSRunner"
  parameters:
    cloud: "US"
    queue: "BNL_PanDA_1"
    source_dir: "."
    source_dir_parent_level: 1
    exclude_source_files:
      - '(^|/)\..*'
      - '.*\.log'
      - '.*\.json'
      - "__pycache__"
      - "work"
      - "OUTDIR"
    init_env_file: "panda-init-env.yml"
    max_walltime: 1800
    core_count: 1
    total_memory: 4000
  max_retries: 1
  output_location: "./aid2e_panda_scheduler_output"
  monitor_interval: 5

workflows:
  workflows:
    - name: "dtlz2_panda_multistage_eval"
      description: "Stage-native PanDA/iDDS template: simreco datasets feed analysis through PanDA-managed dependencies."
      branches:
        - name: "main"
          stages:
            - name: "simreco"
              parallelism:
                max_concurrent: 4
                retry_max: 0
                timeout_sec: 600
              jobs:
                - name: "simreco_eta_0p1_pi"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_simreco"
                    panda_stage: "simreco"
                    panda_job_map: "one"
                    with_output_dataset: true
                    output_file: "my_test.txt"
                    output_dataset: "{panda_scope}.aid2e.dtlz2.{submission_id}.{workflow_id}.{stage_id}.{job_id}"
                    num_events: 200
                    num_events_per_job: 100
                    op_kwargs:
                      particle: "pi+"
                      eta_point: 0.1

                - name: "simreco_eta_0p1_kaon"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_simreco"
                    panda_stage: "simreco"
                    panda_job_map: "one"
                    with_output_dataset: true
                    output_file: "my_test.txt"
                    output_dataset: "{panda_scope}.aid2e.dtlz2.{submission_id}.{workflow_id}.{stage_id}.{job_id}"
                    num_events: 200
                    num_events_per_job: 100
                    op_kwargs:
                      particle: "kaon+"
                      eta_point: 0.1

                - name: "simreco_eta_0p2_pi"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_simreco"
                    panda_stage: "simreco"
                    panda_job_map: "one"
                    with_output_dataset: true
                    output_file: "my_test.txt"
                    output_dataset: "{panda_scope}.aid2e.dtlz2.{submission_id}.{workflow_id}.{stage_id}.{job_id}"
                    num_events: 200
                    num_events_per_job: 100
                    op_kwargs:
                      particle: "pi+"
                      eta_point: 0.2

                - name: "simreco_eta_0p2_kaon"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_simreco"
                    panda_stage: "simreco"
                    panda_job_map: "one"
                    with_output_dataset: true
                    output_file: "my_test.txt"
                    output_dataset: "{panda_scope}.aid2e.dtlz2.{submission_id}.{workflow_id}.{stage_id}.{job_id}"
                    num_events: 200
                    num_events_per_job: 100
                    op_kwargs:
                      particle: "kaon+"
                      eta_point: 0.2

            - name: "ana"
              parallelism:
                max_concurrent: 4
                retry_max: 0
                timeout_sec: 600
              jobs:
                - name: "simreco_eta_0p1_pi"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_ana"
                    panda_stage: "ana"
                    depends_on:
                      stage: "simreco"
                      jobs: "*"
                    dep_type: "datasets"
                    dep_map: "one2one"
                    with_input_datasets: true
                    input_datasets:
                      input_file_names: "{panda_scope}.aid2e.dtlz2.{submission_id}.{workflow_id}.simreco.{job_id}"
                    produces:
                      - "ana_result"

                - name: "simreco_eta_0p1_kaon"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_ana"
                    panda_stage: "ana"
                    depends_on:
                      stage: "simreco"
                      jobs: "*"
                    dep_type: "datasets"
                    dep_map: "one2one"
                    with_input_datasets: true
                    input_datasets:
                      input_file_names: "{panda_scope}.aid2e.dtlz2.{submission_id}.{workflow_id}.simreco.{job_id}"
                    produces:
                      - "ana_result"

                - name: "simreco_eta_0p2_pi"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_ana"
                    panda_stage: "ana"
                    depends_on:
                      stage: "simreco"
                      jobs: "*"
                    dep_type: "datasets"
                    dep_map: "one2one"
                    with_input_datasets: true
                    input_datasets:
                      input_file_names: "{panda_scope}.aid2e.dtlz2.{submission_id}.{workflow_id}.simreco.{job_id}"
                    produces:
                      - "ana_result"

                - name: "simreco_eta_0p2_kaon"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_ana"
                    panda_stage: "ana"
                    depends_on:
                      stage: "simreco"
                      jobs: "*"
                    dep_type: "datasets"
                    dep_map: "one2one"
                    with_input_datasets: true
                    input_datasets:
                      input_file_names: "{panda_scope}.aid2e.dtlz2.{submission_id}.{workflow_id}.simreco.{job_id}"
                    produces:
                      - "ana_result"

            - name: "final"
              scheduler:
                runner_type: "JobLibRunner"
                parameters:
                  n_jobs: 1
              parallelism:
                max_concurrent: 1
                retry_max: 0
                timeout_sec: 300
              jobs:
                - name: "final_objectives"
                  command: ""
                  payload:
                    evaluator_type: "python"
                    python_callable: "examples.evaluators.dtlz2_panda:panda_stage_final"
                    depends_on:
                      stage: "ana"
                      jobs: "*"
                    dep_type: "results"
                    dep_map: "all2one"
                    parent_result_parameter_name: "ana_results"
                    final: true
