# ============================================================================
# ePIC dRICH Multi-Objective Optimization
# ============================================================================
# This example shows:
#   1. Multi-objective optimization with Ax (Sobol warmup + BO)
#   2. dRICH combined objective from multiple metrics: (acceptance*0.5*(piKsep_etalow + piKsep_etahigh))
#   3. ePIC workflow chain: overlap check -> simulation -> reconstruction -> analysis (in drich_problem.py)
# ============================================================================

# ============================================================================
# SECTION 1: PROBLEM DEFINITION
# ============================================================================
problem:
  name: "dRICH Multi-Objective Optimization"
  type: "toy_drich"
  description: "Combined multi-objective optimization of dRICH"

  output_location: "./output"

  # Design space parameters
  design_space:
    path: "./design.params"

  # OBJECTIVES: Define what we're optimizing for, for now multiple objectives
  # ===========================================================================
  objectives:
    - name: "drich_combined"
      direction: "maximize"
      objective_plan:
        script:
          path: "./scripts/drich_problem.py"
          output_file: "objectives.json"
          timeout_sec: 7200
      metrics:
        - name: "combined_objective"
          direction: "maximize"
          metric_key: "combined_objective"
        - name: "piKsep_etalow"
          direction: "maximize"
          metric_key: "piKsep_etalow"
        - name: "piKsep_etahigh"
          direction: "maximize"
          metric_key: "piKsep_etahigh"
        - name: "acceptance"
          direction: "maximize"
          metric_key: "acceptance"

  # EPIC PIPELINE config 
  # ===========================================================================
  epic_pipeline:
    npart: 3000
    analysis_executable: "./scripts/dRICHAna_bootstrap"
  # ===========================================================================

# SECTION 2: SCHEDULER CONFIGURATION
# ============================================================================
scheduler:
  runner_type: "JobLibRunner"
  parameters:
    n_jobs: 5
    backend: "loky"
    verbose: 0
    max_retries: 1
    output_location: "./output"
    monitor_interval: 30


# SECTION 3: OPTIMIZATION CONFIGURATION
# ============================================================================
optimization:
  name: "drich_optimization"
  description: "AID2E dRICH optimization from dRICH-MOBO logic"

  optimizer:
    type: "B0"
    parameters:
      initialization_strategy: "sobol"
      output_name: "drich_optimization_toy"
      seed: 999

      # Trial counts
      n_sobol: 25
      n_mobo: 75
      # Batch policy 
      n_batch_sobol: 10
      n_batch_mobo: 5

      # Objective thresholds 
      objective_thresholds:
        piKsep_etalow: 3.62
        piKsep_etahigh: 4.04
        acceptance: 0.80

      # Generation strategy model configuration
      sobol_model: "SOBOL"
      mobo_model: "BOTORCH_MODULAR"
      mobo_surrogate: "SingleTaskGP"
      mobo_acquisition: "qLogNoisyExpectedHypervolumeImprovement"
      mobo_num_samples: 128
      mobo_warmup_steps: 256

  n_iterations: 100
  n_initial_samples: 25
  parallel_evaluations: 5

# SECTION 4: WORKFLOW EXECUTION
# ============================================================================
workflows:
  - name: "drich_optimization"
    description: "dRICH evaluation workflow"

     # Workflow-level scheduler (overrides global scheduler)
    scheduler:
      runner_type: "JobLibRunner"
      parameters:
        n_jobs: 8
        backend: "loky"
    # Branches: parallel execution paths
    branches:
      - name: "main"
        description: "Main evaluation branch"

        # Branch-level scheduler (overrides workflow scheduler)
        scheduler:
          runner_type: "JobLibRunner"
          parameters:
            n_jobs: 2
            backend: "loky"

        # Stages: sequential computation steps    
        stages:
          - name: "evaluate_objectives"
            description: "Evaluate dRICH combined objective for design points"

            # Individual jobs for this stage
            jobs:
              - name: "drich_eval"
                command: "python examples/drich/scripts/drich_problem.py"
                outputs:
                  - path: "objectives.json"
                    format: "json"

            # Job factory: expand one job into many parallel copies
            # Creates 4 parallel job instances (one per design point)
            job_factory:
              type: "range"
              params:
                n: 4

            # Parallelism policies for this stage
            parallelism:
              max_concurrent: 4
              retry_max: 2
              timeout_sec: 7200

            # Stage-level scheduler (overrides branch scheduler)
            scheduler:
              runner_type: "JobLibRunner"
              parameters:
                n_jobs: 4
                backend: "loky"

            # Output artifacts
            outputs:
              - path: "objectives.json"
                format: "json"
