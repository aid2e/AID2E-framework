# AID2E Full Example Configuration with JobLib Local Scheduler
# This example demonstrates using the JobLib runner for local parallel execution

problem:
  name: "DTLZ2 Multi-Objective Optimization"
  type: "toy"

  objectives:
    - name: "f1"
      direction: "minimize"
      computation:
        script:
          path: "scripts/dtlz2_problem.py"
          output_file: "objectives_{job_id}.json"
          timeout_sec: 600
      metrics_keys: ["f1"]
    - name: "f2"
      direction: "minimize"
      computation:
        script:
          path: "scripts/dtlz2_problem.py"
          output_file: "objectives_{job_id}.json"
          timeout_sec: 600
      metrics_keys: ["f2"]

  design_space:
    path: "design.params"

optimizer:
  kind: "BO"
  max_iterations: 100

  bo:
    surrogate_model:
      name: "GaussianProcess"
      kernel: "matern52"
      noise_level: 1.0e-6
      normalize_y: true

    acquisition_function:
      name: "qEHVI"
      parameters:
        num_mc_samples: 128
        objective_thresholds: [0.0, 0.0]

    parameters:
      initial_design: "lhs"
      n_initial_samples: 24
      batch_size: 4
      parallel_evaluations: 4

# Scheduler configuration for local execution using JobLib
scheduler:
  runner_type: "JobLibRunner"
  joblib:
    n_jobs: -1  # Use all available processors
    backend: "loky"  # Use loky backend for robust multiprocessing
    timeout: 3600  # 1 hour timeout per job
    verbose: 1
  max_retries: 3
  output_location: "./joblib_output"
  monitor_interval: 30

metadata:
  project: "AID2E"
  description: "AI assisted Detector Design for EIC"
  version: "0.0.1"
