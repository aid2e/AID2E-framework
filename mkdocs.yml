site_name: AID2E Framework
site_url: https://aid2e.github.io/AID2E-framework
repo_url: https://github.com/aid2e/AID2E-framework
repo_name: aid2e/AID2E-framework

docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - pymdownx.snippets

nav:
  - Home: overview.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - User Guide:
    - Configuration: user-guide/configuration.md
    - Workflows: user-guide/workflows.md
    - Optimizers: user-guide/optimizers.md
    - Schedulers: user-guide/schedulers.md
    - CLI: user-guide/cli.md
  - API Reference:
    - CLI: api-reference/cli.md
    - Optimizers: api-reference/optimizers.md
    - Schedulers: api-reference/schedulers.md
    - Utilities: api-reference/utilities.md
