[pytest]
# Pytest configuration for AID2E Framework

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests packages

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    core: Tests for aid2e-core package
    optimizers: Tests for aid2e-optimizers package
    schedulers: Tests for aid2e-schedulers package
    utilities: Tests for aid2e-utilities package

# Coverage options (when using pytest-cov)
# Uncomment and modify as needed:
# addopts = --cov=packages --cov-report=html --cov-report=term
