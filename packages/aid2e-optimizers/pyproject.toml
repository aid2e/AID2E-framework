[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aid2e-optimizers"
version = "0.0.1"
description = "Optimization algorithms for AID2E Framework (MOBO, MOEA)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AID2E Team", email = "ksuresh@wm.edu"}
]
keywords = ["optimization", "bayesian", "evolutionary-algorithms", "mobo", "moea"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = []

[project.optional-dependencies]
mobo = ["scikit-learn>=0.24"]
moea = ["pymoo>=0.6"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
]
docs = ["mkdocs>=1.2", "mkdocs-material>=7.1"]

[project.urls]
Homepage = "https://aid2e.github.io/aid2e"
Repository = "https://github.com/aid2e/AID2E-framework.git"

[tool.setuptools]
packages = ["aid2e.optimizers"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"aid2e.optimizers" = ["py.typed"]

[project.entry-points."aid2e.commands"]
optimize = "aid2e.optimizers.cli:optimize_cmd"
